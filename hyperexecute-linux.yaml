---
version: 0.2
runson: linux

autosplit: true
concurrency: 2

pre:
  - gradle clean build -x test

framework:
  name: gradle/testng
  defaultReports: false
  flags:
    - "-Dplatname=linux"
  discoveryType: method
  discoveryMode: remote


retryOnFailure: true
maxRetries: 1

jobLabel: [gradle-testng, linux, autosplit]
