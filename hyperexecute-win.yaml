---
version: 0.2
runson: win

autosplit: true
concurrency: 2

runtime:
  addons:
    - name: "gradle"
      version: "7.0"


pre:
  - gradle clean build -x test

framework:
  name: gradle/testng
  defaultReports: false
  flags:
    - "-Dplatname=win"
  discoveryType: method
  discoveryMode: remote


retryOnFailure: true
maxRetries: 1

jobLabel: [gradle-testng, win, autosplit]
